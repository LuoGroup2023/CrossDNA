# @package _global_

defaults:
  - /pipeline: genomic_benchmark
  - override /scheduler: cosine_warmup_timm

model:
  _name_: crossdnav2
  config:
    _target_: crossdna.configuration_crossdna.CrossDNAConfig

    pretrain: false
    use_s_scan: true
    for_representation: true
    use_bridge: true
    bridge_dropout: 0.0

    use_mem: false
    use_rc_kl: false
    use_barlow: false
    use_tv: false

    alphabet_size: 5
    d_model: 128
    block_size: 128
    depth: 6
    drop_path_rates: [0.0, 0.05]
    dropout: 0.10

    sem_max_weight: 0.0
    sem_warmup_steps: 0
    aux_ce_weight: 0.0

    gate_freeze_steps: 0
    detach_gate: false
    gate_sup_weight: 0.0
    gate_sup_warmup_steps: 0
    gate_temp: 1.0

    use_checkpointing: false
    checkpoint_chunk_size: 1
    checkpoint_core_layers: false
    core_checkpoint_chunk_size: 1

    return_ab_logits: false
    streaming_loss: false
    streaming_report_ab: false

    transformer_cfg:
      hidden_size: ${..d_model}
      norm_eps: 1e-5
      max_position_embeddings: ${dataset.max_length}
      hidden_ratio: 4.0
      hidden_act: "swish"
      fuse_swiglu: true
      attn:
        num_heads: 8
        num_kv_heads: 8
        qkv_bias: false
        window_size: 128
        rope_theta: 10000

    comba_cfg:
      hidden_size: ${..d_model}
      expand_v: 1
      head_dim: 64
      num_heads: 8
      use_gate: true
      mode: "chunk"
      use_short_conv: true
      correction_factor: 0.02
      conv_size: 4
      norm_eps: 1e-5

task:
  loss:
    _name_: cross_entropy
    label_smoothing: 0.03

trainer:
  accelerator: gpu
  devices: 1
  num_nodes: 1
  accumulate_grad_batches: ${div_up:${train.global_batch_size}, ${eval:${trainer.devices} * ${dataset.batch_size} * ${trainer.num_nodes}}}
  max_epochs: 20
  precision: bf16-mixed
  gradient_clip_val: 1.0

dataset:
  tokenizer_name: char
  use_tokenizer: false
  use_padding: true
  add_eos: false
  rc_aug: false
  return_mask: true
  padding_side: left

scheduler:
  t_in_epochs: false
  t_initial: ${eval:${div_up:${dataset.train_len}, ${train.global_batch_size}} * ${trainer.max_epochs}}
  warmup_lr_init: 1e-6
  warmup_t: ${eval:${div_up:${dataset.train_len}, ${train.global_batch_size}} * ${trainer.max_epochs} * 0.05}
  lr_min: ${eval:0.1 * ${optimizer.lr}}

optimizer:
  _name_: adamw
  lr: 8e-5
  weight_decay: 0.01

train:
  gpu_mem: ${eval:"round(float(__import__('subprocess').check_output('nvidia-smi -i 0 --query-gpu=memory.total --format=csv,noheader,nounits', shell=True).strip().decode()) / 1000)"}
  seed: 48
  global_batch_size: ${eval:${trainer.devices} * ${dataset.batch_size}}
  remove_test_loader_in_eval: true

  # 微调时候进行冻结模型主干
  freeze_backbone_epochs: 1
  pretrained_model_strict_load: false
  pretrained_model_path: null

  pretrained_model_state_hook:
    _name_: load_backbone
    freeze_backbone: false

wandb:
  project: CrossDNA-gb-benchmark
  group: crossdnav2_gb_finetune
  job_type: training
  mode: online
  name: gb_finetune_crossdnav2-${dataset.dataset_name}_len-${dataset.max_length}_d_model-${model.config.d_model}_n_layer-${model.config.depth}_lr-${optimizer.lr}_numofcombaheads-${model.config.comba_cfg.num_heads}_combadim-${model.config.comba_cfg.head_dim}_numofSWAheads-${model.config.transformer_cfg.attn.num_heads}_bs-${train.global_batch_size}_dp-${model.config.dropout}_dpb-${model.config.drop_path_rates[1]}_bridge-${model.config.use_bridge}_mem-${model.config.use_mem}_rc-aug-${dataset.rc_aug}_for-rep-${model.config.for_representation}
  id:
  resume: auto

hydra:
  run:
    dir: ./outputs/gb_benchmark/crossdnav2_${now:%Y-%m-%d}/${now:%H-%M-%S-%f}
  job:
    chdir: true